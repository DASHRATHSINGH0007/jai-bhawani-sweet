<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radhey Sweets - {{ category }}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; }
        .product-card { transition: transform 0.3s ease; }
        .product-card:hover { transform: scale(1.05); }
        .card-img-top { height: 220px; object-fit: cover; }
        .price-tag { font-size: 1rem; font-weight: bold; color: #ff6600; }
        .card-title { text-transform: uppercase; font-weight: bold; }
        footer { margin-top: 40px; }
    </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-light shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">Radhey Sweets</a>
        <a href="{{ url_for('home') }}" class="btn btn-outline-primary btn-sm">← Back to Home</a>
    </div>
</nav>

<div class="container my-5">
    <h2 class="text-center mb-4">Our Special {{ category }}</h2>
    <div class="row">
        {% for product in products %}
        <div class="col-md-3 mb-4">
            <div class="card product-card h-100">
                <img src="{{ url_for('static', filename='images/' + product.image) }}"
                     class="card-img-top" alt="{{ product.name }}">
                <div class="card-body">
                    <h5 class="card-title">{{ product.name }}</h5>
                    <p class="card-text">{{ product.desc }}</p>
                    <div class="d-flex justify-content-between align-items-center">
                        <a href="#" class="btn btn-primary">Order Now</a>
                        <span class="price-tag">{{ product.price }}</span>
                    </div>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<footer class="bg-dark text-white text-center py-3">
    <p>&copy; 2025 Radhey Sweets. All Rights Reserved.</p>
</footer>
</body>
</html>
