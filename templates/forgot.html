<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - Jai Bhawani Group</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}
body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    overflow: hidden;
}
.circle {
    position: absolute;
    border-radius: 50%;
    opacity: .3;
    background: white;
}
.c1 { width: 120px; height: 120px; top: 10%; left: 10%; }
.c2 { width: 180px; height: 180px; bottom: 10%; right: 15%; }
.c3 { width: 80px; height: 80px; top: 20%; right: 20%; }
.c4 { width: 100px; height: 100px; bottom: 20%; left: 20%; }
.login-container {
    width: min(380px, calc(100vw - 32px));
    background: white;
    padding: 35px;
    border-radius: 20px;
    box-shadow: 0 5px 20px rgba(0, 0, 0, .2);
    text-align: center;
    position: relative;
    z-index: 2;
}
.logo {
    width: 100px;
    margin-bottom: 20px;
}
.panel { display: none; }
.panel.active { display: block; }
h2 { margin-bottom: 20px; }
.input-box { margin-bottom: 15px; }
.input-box input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 8px;
    outline: none;
}
button {
    width: 100%;
    padding: 12px;
    border: none;
    background: #ff5c5c;
    color: white;
    border-radius: 8px;
    font-size: 16px;
    cursor: pointer;
}
button:hover { background: #e84b4b; }
.footer { margin-top: 15px; }
.footer a {
    text-decoration: none;
    color: #ff5c5c;
}
</style>
</head>
<body>
<div class="circle c1"></div>
<div class="circle c2"></div>
<div class="circle c3"></div>
<div class="circle c4"></div>

<div class="login-container">
    <img src="{{ url_for('static', filename='images/JBG_logo.png') }}" alt="Logo" class="logo">

    <div class="panel active" id="forgot-panel">
        <h2>Forgot Password</h2>
        <form onsubmit="showOTPPage(event)">
            <div class="input-box">
                <input type="text" placeholder="Enter Email or Mobile" required>
            </div>
            <button type="submit">Send OTP</button>
        </form>
        <div class="footer">
            <a href="{{ url_for('login') }}">Back to Login</a>
        </div>
    </div>

    <div class="panel" id="otp-panel">
        <h2>Verify OTP</h2>
        <form onsubmit="showResetPage(event)">
            <div class="input-box">
                <input type="text" placeholder="Enter OTP" required>
            </div>
            <button type="submit">Verify OTP</button>
        </form>
    </div>

    <div class="panel" id="reset-panel">
        <h2>Reset Password</h2>
        <form onsubmit="event.preventDefault()">
            <div class="input-box">
                <input type="password" placeholder="New Password" required>
            </div>
            <div class="input-box">
                <input type="password" placeholder="Confirm Password" required>
            </div>
            <button type="submit">Reset Password</button>
        </form>
        <div class="footer">
            <a href="{{ url_for('login') }}">Back to Login</a>
        </div>
    </div>
</div>

<script>
function showPanel(id) {
    document.querySelectorAll('.panel').forEach((panel) => {
        panel.classList.remove('active');
    });
    document.getElementById(id).classList.add('active');
}

function showOTPPage(event) {
    event.preventDefault();
    showPanel('otp-panel');
}

function showResetPage(event) {
    event.preventDefault();
    showPanel('reset-panel');
}
</script>
</body>
</html>
