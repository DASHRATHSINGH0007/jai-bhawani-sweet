<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jai Bhawani Group - {{ category }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: url("{{ url_for('static', filename='images/bite_bg.png') }}") no-repeat center center fixed !important;
            background-size: cover !important;
        }
        body::before {
            display: none !important; /* Removes the dim overlay */
        }
    </style>
    <style>
        .custom-navbar {
            background-color: rgba(255, 102, 0, 0.92);
        }
        .custom-navbar .navbar-brand,
        .custom-navbar .nav-link {
            color: white !important;
        }

        .product-card {
            transition: transform 0.3s;
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.4);
        }
        .product-card:hover {
            transform: scale(1.03);
            box-shadow: 0 10px 25px rgba(255, 170, 0, 0.4);
            border-color: rgba(255, 170, 0, 0.6);
        }
        .img-wrapper {
            overflow: hidden;
            border-radius: calc(.25rem - 1px) calc(.25rem - 1px) 0 0;
            position: relative;
        }
        .product-card:hover .card-img-top {
            transform: scale(1.08);
        }
        .card-img-top {
            height: 200px;
            object-fit: cover;
            transition: transform 0.4s ease;
        }
        .quick-view-btn {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 2;
        }
        .product-card:hover .quick-view-btn {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
        .price-tag {
            font-size: 1rem;
            font-weight: bold;
            color: #ff6600;
        }
        .card-title {
            text-transform: uppercase;
            font-weight: bold;
        }
        .order-controls {
            gap: 8px;
        }

        .address-fields {
            background: #fff8f3;
            border: 1px solid #ffe0c4;
            border-radius: 8px;
            margin-top: 10px;
            padding: 10px;
        }
        .address-fields summary {
            color: #9a4a00;
            cursor: pointer;
            font-size: 0.86rem;
            font-weight: 700;
            margin-bottom: 8px;
        }
        footer {
            margin-top: 40px;
            position: relative;
            z-index: 1;
        }
    </style>
</head>
<body class="product-page">
<div class="page-wrap">

    {% include '_site_nav.html' %}

    <div class="container my-5">
        <h2 class="text-center mb-4">Our Special {{ category }}</h2>
        <div class="row content-panel">
            {% for product in products %}
            <div class="col-6 col-md-3 col-sm-6 mb-4 px-2">
                <div class="card product-card h-100">
                    <div class="img-wrapper">
                        <img src="{{ url_for('static', filename='images/' + product.image) }}"
                             class="card-img-top"
                             alt="{{ product.name }}">
                        <button class="btn btn-light rounded-circle p-2 shadow-sm quick-view-btn" 
                                data-qv-name="{{ product.name }}"
                                data-qv-desc="{{ product.desc }}"
                                data-qv-price="{{ product.price }}"
                                data-qv-image="{{ url_for('static', filename='images/' + product.image) }}"
                                data-qv-category="{{ category|lower }}"
                                title="Quick View">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" class="bi bi-eye" viewBox="0 0 16 16">
                              <path d="M16 8s-3-5.5-8-5.5S0 8 0 8s3 5.5 8 5.5S16 8 16 8zM1.173 8a13.133 13.133 0 0 1 1.66-2.043C4.12 4.668 5.88 3.5 8 3.5c2.12 0 3.879 1.168 5.168 2.457A13.133 13.133 0 0 1 14.828 8c-.058.087-.122.183-.195.288-.335.48-.83 1.12-1.465 1.755C11.879 11.332 10.119 12.5 8 12.5c-2.12 0-3.879-1.168-5.168-2.457A13.134 13.134 0 0 1 1.172 8z"/>
                              <path d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM4.5 8a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/>
                            </svg>
                        </button>
                    </div>
                    <div class="card-body d-flex flex-column">
                        <h5 class="card-title">{{ product.name }}</h5>
                        <p class="card-text flex-grow-1">{{ product.desc }}</p>
                        <div class="mt-auto">
                            <span class="price-tag">{{ product.price }}</span>
                            <form method="POST" action="{{ url_for('place_order') }}" class="ajax-cart-form mt-2">
                                <input type="hidden" name="product_name" value="{{ product.name }}">
                                <input type="hidden" name="category" value="{{ category|lower }}">
                                <div class="d-flex align-items-center order-controls flex-wrap">
                                    <input type="hidden" name="quantity" value="1">
                                    <button type="submit" name="action" value="buy" class="btn btn-primary btn-sm flex-grow-1">Buy Now</button>
                                    <button type="submit" name="action" value="cart" class="btn btn-outline-primary btn-sm flex-grow-1">Add to Cart</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-3">
        <p>&copy; 2025 Jai Bhawani Group. All Rights Reserved.</p>
    </footer>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<!-- Quick View Modal -->
<div class="modal fade" id="quickViewModal" tabindex="-1" aria-labelledby="quickViewModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content border-0" style="background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);">
      <div class="modal-header border-0">
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body p-4 pt-0">
        <div class="row">
            <div class="col-md-6 mb-3 mb-md-0">
                <img id="qv-image" src="" class="img-fluid rounded shadow-sm" alt="Product Image">
            </div>
            <div class="col-md-6 d-flex flex-column justify-content-center">
                <h3 id="qv-title" class="fw-bold mb-3" style="color: #4a2500;"></h3>
                <h4 id="qv-price" class="text-primary fw-bold mb-3"></h4>
                <p id="qv-desc" class="mb-4 text-muted" style="line-height: 1.6;"></p>
                
                <form method="POST" action="{{ url_for('place_order') }}" class="ajax-cart-form mt-auto">
                    <input type="hidden" name="product_name" id="qv-product-name" value="">
                    <input type="hidden" name="category" id="qv-category" value="">
                    <input type="hidden" name="quantity" value="1">
                    <div class="d-flex gap-2">
                        <button type="submit" name="action" value="buy" class="btn btn-primary btn-lg flex-grow-1">Buy Now</button>
                        <button type="submit" name="action" value="cart" class="btn btn-outline-primary btn-lg flex-grow-1">Add to Cart</button>
                    </div>
                </form>
            </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
    function openQuickView(name, desc, price, imgUrl, category) {
        document.getElementById('qv-title').innerText = name;
        document.getElementById('qv-desc').innerText = desc;
        document.getElementById('qv-price').innerText = price;
        document.getElementById('qv-image').src = imgUrl;
        document.getElementById('qv-product-name').value = name;
        document.getElementById('qv-category').value = category;
        var myModal = new bootstrap.Modal(document.getElementById('quickViewModal'));
        myModal.show();
    }

    document.querySelectorAll('.quick-view-btn').forEach(btn => {
        btn.addEventListener('click', function() {
            const name = this.getAttribute('data-qv-name');
            const desc = this.getAttribute('data-qv-desc');
            const price = this.getAttribute('data-qv-price');
            const imgUrl = this.getAttribute('data-qv-image');
            const category = this.getAttribute('data-qv-category');
            openQuickView(name, desc, price, imgUrl, category);
        });
    });

    document.querySelectorAll('.ajax-cart-form').forEach(form => {
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            // Include which button was clicked
            const submitter = e.submitter;
            if (submitter && submitter.name) {
                formData.append(submitter.name, submitter.value);
            }
            
            fetch(this.action, {
                method: 'POST',
                body: formData,
                headers: {
                    'X-Requested-With': 'XMLHttpRequest'
                }
            })
            .then(res => {
                if (res.redirected) {
                    window.location.href = res.url;
                    return null;
                }
                return res.json();
            })
            .then(data => {
                if (data && data.success) {
                    // Update badge
                    const badge = document.getElementById('cart-badge-count');
                    if (badge) {
                        badge.innerText = data.cart_count;
                        badge.style.display = 'inline-block';
                        badge.classList.add('pop');
                        setTimeout(() => badge.classList.remove('pop'), 200);
                    }
                    
                    // Trigger modal hide if open
                    const qvModalEl = document.getElementById('quickViewModal');
                    const qvModal = bootstrap.Modal.getInstance(qvModalEl);
                    if (qvModal) {
                        qvModal.hide();
                    }
                    
                    if (data.action === 'buy') {
                        // Redirect directly to cart page for checkout/address
                        window.location.href = "/cart";
                    } else {
                        if (typeof updateCartOffcanvas === 'function') {
                            updateCartOffcanvas();
                        }
                        
                        // Also show toast
                        document.getElementById('cartToastMessage').innerText = data.message;
                        const toast = new bootstrap.Toast(document.getElementById('cartToast'));
                        toast.show();
                    }
                } else if (data) {
                    alert(data.message || "An error occurred.");
                }
            })
            .catch(err => console.error("Error:", err));
        });
    });
</script>
</body>
</html>
